<!DOCTYPE html>
<html lang="ca">

<style>

.popup {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.popup-content {
  background: white;
  padding: 25px;
  border-radius: 10px;
  text-align: center;
  max-width: 400px;
  font-family: Arial, sans-serif;
}

.popup-content button {
  margin-top: 15px;
  padding: 8px 18px;
  border: none;
  background: #8B0000;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

.buscar-cif-btn{
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}

.buscar-cif-btn:disabled{
  background:#ccc;
  cursor:not-allowed;
  opacity:0.7;
}

a.btn-secondary{
  padding:10px 20px;
  border-radius:20px;
  color:white;
}

.mini-link-btn{
  font-size:12px;
  padding:6px 12px;
  border-radius:15px;
  background:#eee;
  color:#333;
  text-decoration:none;
  white-space:nowrap;
  transition:0.2s ease;
}

.mini-link-btn:hover{
  background:#d80027;
  color:white;
}

/* LOADER */

.loader-overlay{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:10000;
  color:white;
  font-family:Arial;
}

.loader{
  border:6px solid #f3f3f3;
  border-top:6px solid #d80027;
  border-radius:50%;
  width:50px;
  height:50px;
  animation:spin 1s linear infinite;
  margin-bottom:15px;
}

@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

</style>

<head>

<style>

body{font-family:Arial, sans-serif;background:#fff;margin:0;padding:40px 20px;}

<body>

<div class="container">
<h1>Sol·licitud Projecta’t</h1>

<form id="projectaForm">

<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

<script>

document.addEventListener("DOMContentLoaded", () => {

const canvas = document.getElementById("signaturePad");
const signaturePad = new SignaturePad(canvas);

function clearSignature(){
  signaturePad.clear();
}

window.clearSignature = clearSignature;

const form = document.getElementById("projectaForm");

let enviant = false;

form.addEventListener("submit", async function(e){

  e.preventDefault();

  if(enviant) return;

  if(signaturePad.isEmpty()){
    alert("Cal signar abans d'enviar.");
    return;
  }

  enviant = true;

  const loader = document.getElementById("loaderOverlay");
  loader.style.display = "flex";

  const formData = new FormData(this);
  formData.append("signature", signaturePad.toDataURL());

  try{

    const res = await fetch("/api/send-form", {
      method:"POST",
      body:formData
    });

    loader.style.display = "none";
    enviant = false;

    if(res.ok){
      document.getElementById("successPopup").style.display = "flex";
      this.reset();
      signaturePad.clear();
      buscarCifBtn.disabled = true;
    } else {
      alert("Error en l'enviament.");
    }

  }catch(err){

    loader.style.display = "none";
    enviant = false;
    alert("Error de connexió amb el servidor");

  }

});

});

function closePopup(){
  document.getElementById("successPopup").style.display = "none";
}

</script>

<div id="successPopup" class="popup">
  <div class="popup-content">
    <p>La sol·licitud del programa <strong>Projecta't</strong> s'ha enviat correctament.</p>
    <button onclick="closePopup()">Acceptar</button>
  </div>
</div>

<div id="loaderOverlay" class="loader-overlay">
<div class="loader"></div>
<p>Enviant sol·licitud...</p>
</div>

</body>
