<!DOCTYPE html>
<html lang="ca">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sol·licitud Projecta’t</title>

<style>

body{font-family:Arial, sans-serif;background:#fff;margin:0;padding:40px 20px;}
.container{max-width:950px;margin:auto;}
h1{text-align:center;margin-bottom:40px;}

.section{margin-bottom:40px;}
.section h2{margin-bottom:15px;font-size:18px;}

.row{
display:flex;
gap:20px;
margin-bottom:15px;
flex-wrap:wrap;
}

input,select{
flex:1;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

.checkbox-group{
display:flex;
flex-wrap:wrap;
gap:15px;
margin-top:10px;
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
cursor:pointer;
font-size:14px;
}

.btn-primary{background:#d80027;color:white;}
.btn-secondary{background:#555;color:white;}

.signature-box{
border:1px solid #ccc;
border-radius:8px;
}

.small-text{
font-size:12px;
color:#555;
line-height:1.4;
}

/* ocultar elements */

.hidden{
display:none !important;
}

/* popup */

.popup {
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
z-index:9999;
}

.popup-content{
background:white;
padding:25px;
border-radius:10px;
text-align:center;
max-width:400px;
}

/* spinner botó */

.submit-btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
min-width:120px;
}

.btn-spinner{
display:none;
width:18px;
height:18px;
border:3px solid rgba(255,255,255,0.4);
border-top:3px solid white;
border-radius:50%;
animation:spin 0.8s linear infinite;
}

.submit-btn.loading .btn-spinner{
display:inline-block;
}

.submit-btn.loading .btn-text{
opacity:0.7;
}

.submit-btn:disabled{
opacity:0.7;
cursor:not-allowed;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

/* CIF */

.buscar-cif-btn{
display:flex;
align-items:center;
gap:6px;
white-space:nowrap;
}

.buscar-cif-btn:disabled{
background:#ccc;
cursor:not-allowed;
opacity:0.7;
}

.mini-link-btn{
font-size:12px;
padding:6px 12px;
border-radius:15px;
background:#eee;
color:#333;
text-decoration:none;
}

.mini-link-btn:hover{
background:#d80027;
color:white;
}

</style>
</head>

<body>

<div class="container">

<h1>Sol·licitud Projecta’t</h1>

<form id="projectaForm">

<!-- DADES PERSONALS -->

<div class="section">

<h2>Dades personals</h2>

<div class="row">
<input name="nom" placeholder="Nom" required>
<input name="cognoms" placeholder="Cognoms" required>
</div>

<div class="row">
<input name="nomSentit" placeholder="Nom sentit">
<input name="dni" placeholder="DNI" required>
</div>

<div class="row">
<input type="date" name="dataNaixement" required>
<input name="paisOrigen" placeholder="País d'origen" required>
</div>

<div class="row">
<select name="genere" required>
<option value="">Selecciona gènere</option>
<option value="Home">Home</option>
<option value="Dona">Dona</option>
<option value="No binari">No binari</option>
</select>
</div>

<div class="row">
<input name="nass" placeholder="NASS (Seguretat Social)">
<input name="adrecaParticipant" placeholder="Adreça" required>
</div>

<div class="row">
<input name="poblacioParticipant" placeholder="Població" required>
<input name="comarcaParticipant" placeholder="Comarca" required>
<input name="cpParticipant" placeholder="Codi postal" required>
</div>

<div class="row">
<input type="email" name="email" placeholder="Correu electrònic" required>
<input name="telefon" placeholder="Telèfon" required>
</div>

</div>

<!-- SITUACIÓ LABORAL -->

<div class="section">

<h2>Situació laboral</h2>

<label>
<input type="checkbox" id="ocupatCheck" name="ocupat" value="true">
Ocupat/ada
</label>

<label>
<input type="checkbox" name="erto" value="true">
Afectada ERTO
</label>

<label>
<input type="checkbox" name="cpn" value="true">
Cuidadora no professional
</label>

<div class="row hidden" id="codi3Row">

<select name="codi3">

<option value="">Selecciona règim</option>

<option value="RG – Règim general">
RG – Règim general
</option>

<option value="AU – Règim especial d’autònoms">
AU – Règim especial d’autònoms
</option>

<option value="AP – Administració pública">
AP – Administració pública
</option>

</select>

</div>

</div>

<!-- SIGNATURA -->

<div class="section">

<h2>Signatura</h2>

<canvas id="signaturePad" class="signature-box" width="850" height="200"></canvas>

<br><br>

<div style="display:flex;gap:15px;margin-top:15px;">

<button type="button" class="btn-secondary" onclick="clearSignature()">
Esborrar signatura
</button>

<button type="submit" class="btn-primary submit-btn" id="submitBtn">

<span class="btn-text">Enviar</span>
<span class="btn-spinner"></span>

</button>

</div>

</div>

</form>

</div>

<!-- popup -->

<div id="successPopup" class="popup">

<div class="popup-content">

<p>
La sol·licitud del programa <strong>Projecta't</strong> s'ha enviat correctament.
</p>

<button onclick="closePopup()">Acceptar</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

<script>

document.addEventListener("DOMContentLoaded", () => {

const canvas = document.getElementById("signaturePad");
const signaturePad = new SignaturePad(canvas);

window.clearSignature = () => signaturePad.clear();

const form = document.getElementById("projectaForm");
const submitBtn = document.getElementById("submitBtn");

const ocupatCheckbox = document.getElementById("ocupatCheck");
const codi3Row = document.getElementById("codi3Row");

if(ocupatCheckbox && codi3Row){

ocupatCheckbox.addEventListener("change", () => {

if(ocupatCheckbox.checked){

codi3Row.classList.remove("hidden");

}else{

codi3Row.classList.add("hidden");

const select = codi3Row.querySelector("select");
if(select) select.value="";

}

});

}

form.addEventListener("submit", async function(e){

e.preventDefault();

if(signaturePad.isEmpty()){
alert("Cal signar abans d'enviar.");
return;
}

if(submitBtn.classList.contains("loading")) return;

submitBtn.classList.add("loading");
submitBtn.disabled = true;

const formData = new FormData(this);
formData.append("signature", signaturePad.toDataURL());

try{

const res = await fetch("/api/send-form", {
method:"POST",
body:formData
});

submitBtn.classList.remove("loading");
submitBtn.disabled = false;

if(res.ok){

document.getElementById("successPopup").style.display="flex";

this.reset();
signaturePad.clear();

}else{

alert("Error en l'enviament");

}

}catch(err){

submitBtn.classList.remove("loading");
submitBtn.disabled = false;

alert("Error de connexió amb el servidor");
console.error(err);

}

});

});

function closePopup(){

document.getElementById("successPopup").style.display="none";

}

</script>

</body>
</html>
